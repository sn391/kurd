[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kurd"
version = "0.4.0"
description = "Enterprise Model Context Protocol gateway with multi-tenancy, billing, RBAC, DLQ, idempotency, and secrets management."
authors = [
    { name = "Semko Kermashani", email = "sn391@yahoo.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["mcp", "model-context-protocol", "gateway", "rust", "python", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/sn391/kurd"
Repository = "https://github.com/sn391/kurd"
Issues = "https://github.com/sn391/kurd/issues"

[tool.maturin]
module-name = "kurd._kurd"
