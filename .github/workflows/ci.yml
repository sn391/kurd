name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Cargo check
        run: cargo check

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        shell: bash
        if: runner.os != 'Windows'
        run: |
          python -m pip install target/wheels/*.whl

      - name: Install wheel on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $wheel = Get-ChildItem target/wheels/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName

      - name: Test installed wheel
        shell: bash
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/kurd-tests"
          cp -R tests "$RUNNER_TEMP/kurd-tests/"
          cd "$RUNNER_TEMP/kurd-tests"
          python -m pytest -q

      - name: Test installed wheel on Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kurd-tests"
          Copy-Item -Recurse tests "$env:RUNNER_TEMP\kurd-tests\tests"
          Set-Location "$env:RUNNER_TEMP\kurd-tests"
          python -m pytest -q