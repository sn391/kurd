name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    name: Linux wheels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Linux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --compatibility pypi
          manylinux: auto

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*

  windows:
    name: Windows wheels
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --compatibility pypi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*

  macos:
    name: macOS wheels
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --compatibility pypi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/*

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
      - sdist

    environment:
      name: pypi

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/