[package]
name = "kurd"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "High-performance MCP gateway for Python powered by Rust."
repository = "https://github.com/sn391/kurd"

[lib]
name = "_kurd"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
axum = "0.8"
hyper = "1"
tower = "0.5"
once_cell = "1"
