name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Cargo check
        run: cargo check

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem target/wheels/*.whl | Select-Object -First 1
          python -m pip install $wheel.FullName
      
      - name: Run tests against installed wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kurd-tests"
          Copy-Item -Recurse tests "$env:RUNNER_TEMP\kurd-tests\tests"
          Set-Location "$env:RUNNER_TEMP\kurd-tests"
          python -m pytest -q