[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kurd"
version = "0.2.0"
description = "The high-performance MCP gateway with Rust core."
authors = [
    { name = "Semko Kermashani", email = "sn391@yahoo.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/sn391/kurd"
Repository = "https://github.com/sn391/kurd"
Issues = "https://github.com/sn391/kurd/issues"

[tool.maturin]
module-name = "kurd._kurd"